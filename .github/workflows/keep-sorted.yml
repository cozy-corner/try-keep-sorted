name: keep-sorted

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-sorted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install keep-sorted
        run: go install github.com/google/keep-sorted@v0.7.1

      - name: Check if files are sorted
        run: keep-sorted --mode=lint .
